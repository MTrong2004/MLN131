<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px 60px 80px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .macbook {
    position: relative;
    width: 1320px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* --- SCREEN LID --- */
  .lid {
    position: relative;
    width: 1220px;
    height: 708px;
    background: #18191b;
    border-radius: 18px 18px 3px 3px;
    padding: 10px 10px 14px 10px;
    box-shadow:
      inset 0 0 0 1px #3a3d42,
      inset 0 1px 0 0.5px rgba(255,255,255,0.3),
      0 0 1px 1px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Display bezel & screen */
  .screen-frame {
    position: relative;
    width: 1200px;
    height: 675px;
    border-radius: 10px;
    overflow: hidden;
    background: #f6efdc;
  }

  .screen-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Camera notch */
  .camera-notch {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 14px;
    background: #18191b;
    border-bottom-left-radius: 7px;
    border-bottom-right-radius: 7px;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .lens {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #020509;
    box-shadow: inset 0 0 1.5px #1e3a60, 0 0 1px rgba(255,255,255,0.25);
  }
  .sensor {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #051008;
    box-shadow: 0 0 1px rgba(0,255,100,0.4);
  }

  /* Glass reflection */
  .glass-glare {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      126deg,
      rgba(255, 255, 255, 0.18) 0%,
      rgba(255, 255, 255, 0.08) 20%,
      rgba(255, 255, 255, 0.015) 34%,
      transparent 42%
    );
    pointer-events: none;
    z-index: 5;
  }

  /* --- HINGE --- */
  .hinge {
    width: 320px;
    height: 7px;
    background: linear-gradient(180deg, #0e0f11 0%, #1e1f22 100%);
    border-radius: 0 0 3px 3px;
    margin-top: -2px;
    z-index: 2;
  }

  /* --- BASE / CHASSIS --- */
  .base {
    position: relative;
    width: 1300px;
    height: 20px;
    background: linear-gradient(180deg, #e4e7eb 0%, #bcc1c8 45%, #8c929a 85%, #666a72 100%);
    border-radius: 2px 2px 14px 14px;
    margin-top: -4px;
    z-index: 3;
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,0.95),
      inset 0 -1px 2px rgba(0,0,0,0.4),
      0 2px 4px rgba(0,0,0,0.3);
  }

  /* Thumb groove cutout */
  .thumb-groove {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 6px;
    background: linear-gradient(180deg, #5c6068 0%, #9a9ea6 100%);
    border-bottom-left-radius: 5px;
    border-bottom-right-radius: 5px;
    box-shadow: inset 0 1px 1.5px rgba(0,0,0,0.5);
  }

  /* Feet */
  .feet {
    position: absolute;
    bottom: -3px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 80px;
    z-index: 1;
  }
  .foot {
    width: 44px;
    height: 4px;
    background: #1c1d1f;
    border-radius: 3px;
  }

  /* --- REALISTIC SHADOW --- */
  .shadow-wrap {
    position: absolute;
    bottom: -40px;
    width: 1340px;
    height: 65px;
    z-index: 0;
    pointer-events: none;
  }
  .contact-shadow {
    position: absolute;
    top: 0;
    left: 40px;
    right: 40px;
    height: 16px;
    background: rgba(30, 20, 10, 0.55);
    border-radius: 50%;
    filter: blur(8px);
  }
  .ambient-shadow {
    position: absolute;
    top: 4px;
    left: 15px;
    right: 15px;
    height: 40px;
    background: rgba(50, 32, 18, 0.3);
    border-radius: 50%;
    filter: blur(22px);
  }
</style>
</head>
<body>

<div class="macbook">
  <div class="lid">
    <div class="camera-notch">
      <div class="sensor"></div>
      <div class="lens"></div>
    </div>
    <div class="screen-frame">
      <img src="screen_1080p.png" alt="Game Screen">
      <div class="glass-glare"></div>
    </div>
  </div>

  <div class="hinge"></div>

  <div class="base">
    <div class="thumb-groove"></div>
    <div class="feet">
      <div class="foot"></div>
      <div class="foot"></div>
    </div>
  </div>

  <div class="shadow-wrap">
    <div class="ambient-shadow"></div>
    <div class="contact-shadow"></div>
  </div>
</div>

</body>
</html>
