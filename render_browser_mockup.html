<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 50px 70px 80px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .window {
    position: relative;
    width: 1240px;
    background: #fffdfa;
    border-radius: 18px;
    overflow: hidden;
    box-shadow:
      0 26px 60px rgba(50, 30, 15, 0.22),
      0 8px 20px rgba(50, 30, 15, 0.12),
      0 0 0 1px rgba(74, 52, 35, 0.12);
  }

  .titlebar {
    height: 48px;
    background: #eedfc7;
    border-bottom: 1.5px solid #dfcca9;
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 16px;
  }

  .traffic-lights {
    display: flex;
    gap: 8px;
  }
  .dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
  }
  .dot.red { background: #ff5f56; border: 1px solid #e0443e; }
  .dot.yellow { background: #ffbd2e; border: 1px solid #dea123; }
  .dot.green { background: #27c93f; border: 1px solid #1aab29; }

  .address-bar {
    flex: 1;
    max-width: 580px;
    margin: 0 auto;
    height: 30px;
    background: rgba(255,255,255,0.85);
    border: 1px solid #d5c09a;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #5a4533;
    padding: 0 12px;
  }
  .lock-icon { font-size: 11px; opacity: 0.7; }
  .site-url { letter-spacing: 0.3px; }

  .content-frame {
    width: 100%;
    height: 697px; /* 1240 / (1920/1080) */
    background: #f6efdc;
  }
  .content-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="traffic-lights">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <div class="address-bar">
      <span class="lock-icon">🔒</span>
      <span class="site-url">ban-lang-kieu-mau.vercel.app</span>
    </div>
  </div>
  <div class="content-frame">
    <img src="screen_1080p.png" alt="Game Start">
  </div>
</div>

</body>
</html>
